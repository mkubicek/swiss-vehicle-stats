name: Update

on:
  schedule:
    # 5th, 15th, 25th of each month at 08:00 UTC
    - cron: '0 8 5,15,25 * *'
  workflow_dispatch:
    inputs:
      generate_gifs:
        description: 'Generate GIF animations'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen
        env:
          UV_SYSTEM_PYTHON: "1"

      - name: Restore raw vehicle data (compressed)
        id: raw-cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw.tar.zst
          key: raw-data-v3-${{ hashFiles('scripts/download.py') }}-${{ runner.os }}
          restore-keys: |
            raw-data-v3-

      - name: Extract cached raw data
        if: hashFiles('data/raw.tar.zst') != ''
        run: |
          mkdir -p data/raw
          tar --zstd -xf data/raw.tar.zst -C data/
          rm -f data/raw.tar.zst
          echo "Cached files:" && ls -lh data/raw/

      - name: Download data (with per-file invalidation)
        id: download
        run: uv run scripts/download.py
        env:
          DOWNLOAD_TIMEOUT: "3600"
          DOWNLOAD_MIN_HEADROOM: "360"

      - name: Re-pack raw data for next cache
        if: always()
        run: |
          if [ -d data/raw ] && ls data/raw/*.txt >/dev/null 2>&1; then
            tar --zstd -cf data/raw.tar.zst -C data raw/
          fi

      - name: Save updated raw vehicle data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw.tar.zst
          key: raw-data-v3-${{ hashFiles('scripts/download.py') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Stop if download incomplete
        if: steps.download.outputs.partial == 'true'
        run: |
          echo "::error::Raw data download incomplete; partial cache was saved. Re-run this workflow to resume."
          exit 1

      - name: Process data
        if: steps.download.outputs.partial != 'true'
        run: uv run scripts/process.py

      - name: Validate data
        if: steps.download.outputs.partial != 'true'
        run: uv run scripts/validate.py

      - name: Generate projection
        if: steps.download.outputs.partial != 'true'
        run: uv run scripts/project.py

      - name: Generate charts
        if: steps.download.outputs.partial != 'true'
        run: |
          DAY=$(date -u +%d)
          if [ "$DAY" = "05" ] || [ "${{ inputs.generate_gifs }}" = "true" ]; then
            uv run scripts/chart.py
          else
            uv run scripts/chart.py --skip-gifs
          fi

      - name: Generate report
        if: steps.download.outputs.partial != 'true'
        run: uv run scripts/report.py

      - name: Commit and push
        if: steps.download.outputs.partial != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/ charts/ reports/ warnings.log
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "data: update $(date +%Y-%m)"
          branch="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3; do
            git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
            if ! git rebase "origin/${branch}"; then
              echo "::error::Could not rebase generated update onto origin/${branch}. Re-run after resolving the conflicting branch changes."
              exit 1
            fi
            if git push origin "HEAD:${branch}"; then
              exit 0
            fi
            echo "Push was rejected; refreshing ${branch} before retry ${attempt}/3."
            sleep $((attempt * 5))
          done
          echo "::error::Unable to push generated update after 3 attempts."
          exit 1
