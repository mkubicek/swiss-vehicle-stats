# Brand → country of the ultimate controlling shareholder of the parent group.
#
# This is a SECOND, orthogonal dimension to brand_origin (which is by heritage).
# It exists for the Chinese-ownership story: brands like Volvo, Polestar, MG and
# Smart carry European/British heritage (brand_origin unchanged) but are
# China-owned. Classification is by brand ownership, NEVER by production location
# (Dacia Spring, Tesla Shanghai, pre-2025 BMW iX3 are China-*made*, not China-
# *owned*, and stay with their owner's country). See METHODOLOGY.md > Ownership
# Classification for the bloc definitions and footnoted edge cases.
#
# The China-owned bloc = origin==China OR owner_country==China, so heritage-
# Chinese brands are covered even without an explicit entry here; the entries
# that MATTER are the non-China-heritage brands controlled from China.
# validate.py warns (owner_country:<brand>:<count>) for any brand contributing
# ≥20 BEV registrations in the trailing 12 months without an entry here, so new
# entrants surface for classification.
brand_owner_country:
  # --- China-owned, non-Chinese heritage (the "European badges" set) ---
  VOLVO: China            # Geely Holding
  VOLVO-T: China
  POLESTAR: China         # Geely Holding (Nasdaq listing ≠ controlling ownership)
  LOTUS: China            # Geely Holding
  SMART: China            # 50/50 Geely–Mercedes JV, production in Xi'an
  MG: China               # SAIC
  MAXUS: China            # SAIC
  # --- China-owned, Chinese heritage ---
  BYD: China
  NIO: China
  XPENG: China
  ZEEKR: China            # Geely
  LYNK & CO: China        # Geely (engineering in Gothenburg; heritage ambiguous)
  LYNK: China
  "LYNK&CO": China
  LEAPMOTOR: China        # Leapmotor (Stellantis holds a minority stake / export JV)
  LEAP MOTOR: China
  AIWAYS: China
