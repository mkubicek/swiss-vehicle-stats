# Market segment per canonical model, for cross-maker comparison (e.g. BMW
# 3 Series vs Mercedes C-Class vs Audi A4 = "Compact Executive"). Keyed on the
# canonical model emitted by normalize_model (case-insensitive). Unmapped
# models fall to "Other" and are excluded from segment charts.
#
# Principle: segment = body/market class. A performance variant inherits its
# base model's segment (BMW M3 -> Compact Executive, with the 3 Series). Only
# standalone sports cars with no volume base get "Sports / GT" (Z4, TT).
