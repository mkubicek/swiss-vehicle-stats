# Fuel type normalization
# NOTE: ASTRA data uses spaces around "/" (e.g. "Benzin / Elektrisch")
# _petrol_hybrid / _diesel_hybrid are intermediate values resolved at runtime
# into PHEV vs HEV using Hybridcode (2022+) or CO2 fallback (pre-2022).
fuel_types:
  Benzin: Petrol
  Diesel: Diesel
  Elektrisch: BEV
  "Benzin / Elektrisch": _petrol_hybrid
  "Diesel / Elektrisch": _diesel_hybrid
  "Benzin/Elektrisch": _petrol_hybrid
  "Diesel/Elektrisch": _diesel_hybrid
  "Elektrisch mit RE": PHEV
  "Elektrisch mit RE (Range Extender)": PHEV
  Wasserstoff: Hydrogen
  "Wasserstoff / Elektrisch": Hydrogen
  "Erdgas (CNG)": CNG
  "Erdgas (CNG) / Benzin": CNG
  "Erdgas / Benzin (CNG)": CNG
  "Flüssiggas (LPG)": LPG
  "Flüssiggas (LPG) / Benzin": LPG
  "Benzin / Alkohol (Ethanol)": Petrol
  "Benzin/Alkohol (Ethanol)": Petrol
  "Alkohol (Ethanol)": Petrol
  "Gas (CNG/GPL)": CNG
  Petrol: Petrol
  Methanol: Other

