  LAND ROVER DISCOVERYSP.SD4: Land Rover Discovery Sport
  LAND ROVER DISCOVERYSP.DI4: Land Rover Discovery Sport
  LAND ROVER DISCOVERYSP.TDE: Land Rover Discovery Sport
  LAND ROVER DISCOVERYSP.ED4: Land Rover Discovery Sport
